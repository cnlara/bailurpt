<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白鹿分局 · 营销到人大屏</title>
<style>
:root{
  --red:#e60012; --red2:#ff3b4e; --gold:#f5c451; --bg:#070b14; --bg2:#0d1424;
  --card:#111a2e; --card2:#141f36; --line:#22304d; --tx:#e8edf7; --tx2:#93a4c3;
  --tx3:#5d6f92; --green:#37d67a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100%}
body{background:radial-gradient(1200px 500px at 50% -100px,#16223e 0%,var(--bg) 60%)}
.wrap{max-width:1680px;margin:0 auto;padding:14px 20px 30px}

/* ===== 顶部 ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:12px}
.title{display:flex;align-items:baseline;gap:12px}
.title h1{font-size:26px;letter-spacing:2px;
  background:linear-gradient(90deg,#fff 20%,var(--red2) 60%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.title .sub{color:var(--tx2);font-size:13px}
.clock{color:var(--tx2);font-size:13px;text-align:right;line-height:1.7}
.clock b{color:var(--gold);font-weight:600}

/* 全区汇总条 */
.sumbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 6px}
.sum{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;position:relative;overflow:hidden}
.sum::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.sum .k{font-size:12px;color:var(--tx2)}
.sum .v{font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.sum .v small{font-size:13px;color:var(--tx3);font-weight:400;margin-left:2px}
.sum.gold::before{background:var(--gold)}
.sum.gold .v{color:var(--gold)}

/* ===== 分区标题 ===== */
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec .tag{background:linear-gradient(90deg,var(--red),#ff7a45);color:#fff;font-size:13px;
  padding:3px 12px;border-radius:4px;font-weight:700;letter-spacing:1px;flex:none}
.sec .tag.g2{background:linear-gradient(90deg,#2c3e60,#42598f)}
.sec h2{font-size:17px;letter-spacing:1px}
.sec .note{color:var(--tx3);font-size:12px;margin-left:auto}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* ===== 卡片 ===== */
.grid{display:grid;gap:12px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:var(--red2);
  box-shadow:0 8px 24px rgba(230,0,18,.25)}
.card.bailu{background:linear-gradient(160deg,#1b2136 0%,var(--card) 55%);
  border:1px solid rgba(230,0,18,.45)}
.card.bailu::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;
  background:radial-gradient(circle,rgba(230,0,18,.22),transparent 70%)}
.rank{position:absolute;top:0;left:0;width:30px;height:30px;border-bottom-right-radius:12px;
  background:rgba(230,0,18,.85);color:#fff;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center}
.rank.r1{background:linear-gradient(135deg,#f5c451,#d99a17);color:#3a2500}
.rank.r2{background:linear-gradient(135deg,#d8e2f0,#9aa9c0);color:#23293a}
.rank.r3{background:linear-gradient(135deg,#e59b6c,#a75c2b);color:#381901}
.cname{font-size:19px;font-weight:800;letter-spacing:1px;padding-left:8px}
.card.bailu .cname{color:#fff}
.m4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.m4 .m{text-align:center}
.m4 b{display:block;font-size:21px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.m4 b.zero{color:var(--tx3)}
.m4 .m.hl b{color:var(--red2);text-shadow:0 0 14px rgba(255,59,78,.45)}
.m4 span{font-size:11px;color:var(--tx3)}
.monline{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
  color:var(--tx2);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.monline b{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.ratebar{margin-top:8px;display:flex;align-items:center;gap:8px}
.ratebar .bar{flex:1;height:6px;background:#1a2440;border-radius:3px;overflow:hidden}
.ratebar .bar i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}
.ratebar em{font-style:normal;font-size:11px;color:var(--tx2);flex:none;min-width:52px;text-align:right}
.pcnt{position:absolute;right:10px;top:10px;font-size:11px;color:var(--tx3)}

/* 后排小卡 */
.card.sm{padding:10px 12px}
.card.sm .cname{font-size:15px}
.smrow{margin-top:6px;font-size:12px;color:var(--tx2);display:flex;gap:8px;flex-wrap:wrap}
.smrow b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.smrow .rhl{color:var(--red2)}
.card.sm .pcs{position:absolute;right:10px;top:9px;font-size:11px;color:var(--tx3)}

/* ===== 弹层 ===== */
.mask{position:fixed;inset:0;background:rgba(3,6,12,.78);backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:center;z-index:50;padding:24px 12px;overflow:auto}
.mask.on{display:flex}
.modal{background:linear-gradient(180deg,#131c31,#0c1220);border:1px solid rgba(230,0,18,.5);
  border-radius:16px;width:min(1060px,100%);box-shadow:0 24px 80px rgba(0,0,0,.6);
  animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;gap:14px;padding:16px 20px 12px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.mhead h3{font-size:21px;letter-spacing:1px;
  background:linear-gradient(90deg,#fff,var(--red2));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.mhead .mnote{color:var(--tx3);font-size:12px}
.tabs{display:flex;gap:8px;margin-left:auto}
.tabs button{background:#182342;border:1px solid var(--line);color:var(--tx2);
  padding:6px 20px;border-radius:20px;font-size:14px;cursor:pointer;transition:.15s}
.tabs button.on{background:linear-gradient(90deg,var(--red),#ff5a45);color:#fff;
  border-color:transparent;font-weight:700;box-shadow:0 0 16px rgba(230,0,18,.4)}
.x{background:none;border:none;color:var(--tx2);font-size:24px;cursor:pointer;line-height:1;padding:0 2px}
.x:hover{color:var(--red2)}
.mbody{padding:16px 20px 20px}

/* 圆形进度 */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ring{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 6px 8px;position:relative}
.ring svg{width:92px;height:92px}
.ring .track{fill:none;stroke:#1d2946;stroke-width:9}
.ring .prog{fill:none;stroke:url(#gr);stroke-width:9;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .7s}
.ring .val{position:absolute;left:0;right:0;top:38px;font-size:15px;font-weight:800;
  color:#fff;font-variant-numeric:tabular-nums}
.ring .cap{font-size:12px;color:var(--tx2);margin-top:2px}
.ring .cap b{color:#fff}
.ring .pct{font-size:11px;color:var(--tx3);margin-top:1px}

/* 指标chips */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.chip .k{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v{font-size:17px;font-weight:800;color:#fff;margin-top:2px;font-variant-numeric:tabular-nums}
.chip.warn .v{color:var(--red2)}
.chip.gold .v{color:var(--gold)}

/* 到人表 */
.ptitle{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px}
.ptitle h4{font-size:15px;color:var(--gold);letter-spacing:1px}
.ptitle span{font-size:12px;color:var(--tx3)}
.tblwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:420px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
thead th{position:sticky;top:0;background:#1a2544;color:#cdd8ee;font-weight:600;
  padding:9px 8px;cursor:pointer;white-space:nowrap;user-select:none;border-bottom:1px solid var(--line)}
thead th:hover{color:var(--red2)}
thead th .arr{font-size:10px;color:var(--red2)}
tbody td{padding:7px 8px;text-align:center;border-bottom:1px solid #17203a;
  font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td:first-child{text-align:left;font-weight:600;color:#fff}
tbody td.pcol{color:var(--tx2);font-size:12px;text-align:left;max-width:210px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover{background:rgba(230,0,18,.07)}
tbody td b{color:var(--red2);font-weight:800}
.empty{padding:26px;text-align:center;color:var(--tx3);font-size:13px}

footer{margin-top:26px;color:var(--tx3);font-size:12px;line-height:1.9;border-top:1px solid var(--line);padding-top:10px}
footer b{color:var(--tx2)}

@media (max-width:600px){
  .wrap{padding:10px 10px 20px}
  .title h1{font-size:20px}
  .grid.big{grid-template-columns:repeat(2,1fr)}
  .grid.small{grid-template-columns:repeat(2,1fr)}
  .m4 b{font-size:17px}
  .cname{font-size:16px}
  .clock{text-align:left}
  .mask{padding:8px 4px}
  .mhead{padding:12px 12px 8px}
  .mbody{padding:10px 12px 14px}
  .sum .v{font-size:20px}
}
</style>
</head>

</div>

<div class="mask" id="mask">

      <div class="tblwrap"><table id="ptable"></table></div>
    </div>
  </div>
</div>

const M = new Proxy({}, {get:(_, k) => (DATA && DATA.meta) ? DATA.meta[k] : undefined});
const T = new Proxy({}, {get:(_, k) => (DATA && DATA.total) ? DATA.total[k] : undefined});
const fmt = v => (v==null ? '—' : (Math.abs(v-Math.round(v))<0.05 ? Math.round(v) : (+v).toFixed(1)));
const pct = v => (v==null ? '—' : Math.round(v*100) + '%');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortArea = a => a.replace(/温州鹿城/g,'').replace(/公众片区（综合）/g,'').replace(/支局本级/g,'本级');
let TAB = 0, CUR = null, SORT = {key:'rh', dir:-1};

/* ---------- 顶部汇总 ---------- */
function countUp(el, target, dur=900){
  const t0 = performance.now(), from = 0;
  (function step(t){
    const p = Math.min((t-t0)/dur, 1), e = 1-Math.pow(1-p,3);
    el.textContent = fmt(from + (target-from)*e);
    if(p<1) requestAnimationFrame(step);
  })(t0);
}
function renderSum(){
  const items = [
    ['全区当日移动', T.day.yd, ''], ['全区当日宽带', T.day.kd, ''],
    ['当日融合主卡', T.day.rh, ''], ['当日FTTR', T.day.fttr, ''],
    ['当月累计移动', T.month.yd, 'gold'], ['当月累计宽带', T.month.kd, 'gold'],
    ['当月融合主卡', T.month.rh, 'gold'], ['当月FTTR', T.month.fttr, 'gold'],
  ];
  document.getElementById('sumbar').innerHTML = items.map(([k,v,c]) =>
    `<div class="sum ${c}"><div class="k">${k}</div><div class="v">${fmt(v)}</div></div>`).join('');
  document.querySelectorAll('.sum .v').forEach((el,i)=>{ const v=items[i][1];
    if(typeof v==='number') countUp(el, v); });
  document.getElementById('upd').textContent = M.u;
  document.getElementById('gen').textContent = M.gen;
}

/* ---------- 卡片 ---------- */
function cardHtml(b, i, big){
  const d = b.day, m = b.month;
  const rr = d.rr==null ? null : Math.min(d.rr,1.2);
  const monLine = `当月 <span>移</span><b>${fmt(m.yd)}</b> <span>宽</span><b>${fmt(m.kd)}</b> <span>融</span><b>${fmt(m.rh)}</b> <span>F</span><b>${fmt(m.fttr)}</b>`;
  if(big){
    const rk = i<3 ? `r${i+1}` : '';
    return `<div class="card bailu" onclick="openM('b',${i})">
      <div class="rank ${rk}">${i+1}</div>
      <div class="cname">${esc(b.name)}</div>
      <div class="pcnt">到人 日${b.pdn}/月${b.pmn}</div>
      <div class="m4">
        <div class="m"><b class="${d.yd?'':'zero'}">${fmt(d.yd)}</b><span>移动</span></div>
        <div class="m"><b class="${d.kd?'':'zero'}">${fmt(d.kd)}</b><span>宽带</span></div>
        <div class="m hl"><b class="${d.rh?'':'zero'}">${fmt(d.rh)}</b><span>融合</span></div>
        <div class="m"><b class="${d.fttr?'':'zero'}">${fmt(d.fttr)}</b><span>FTTR</span></div>
      </div>
      <div class="monline">${monLine}</div>
      <div class="ratebar"><div class="bar"><i style="width:${rr==null?0:rr*100}%"></i></div>
        <em>融合完成${d.rr==null?'—':Math.round(d.rr*100)+'%'}</em></div>
    </div>`;
  }
  return `<div class="card sm" onclick="openM('o',${i})">
    <div class="cname">${esc(b.name)}</div>
    <div class="pcs">日${b.pdn}人</div>
    <div class="smrow"><span>日</span><b>${fmt(d.yd)}</b><span>宽</span><b>${fmt(d.kd)}</b>
      <span class="rhl">融</span><b class="rhl">${fmt(d.rh)}</b><span>| 月融</span><b>${fmt(m.rh)}</b></div>
  </div>`;
}
function renderCards(){
  document.getElementById('gridB').innerHTML = DATA.bailu.map((b,i)=>cardHtml(b,i,true)).join('');
  document.getElementById('gridO').innerHTML = DATA.other.map((b,i)=>cardHtml(b,i,false)).join('');
}

/* ---------- 弹层 ---------- */
const RINGDEF = [
  ['yd','yr','移动','户'], ['kd','kr','宽带','户'],
  ['rh','rr','融合主卡','张'], ['fttr','fr','FTTR新增','台'],
];
const CHIPDEF = [
  ['r129','129及以上主卡',''], ['r169','169及以上主卡',''], ['gt','融合高套(折算)','gold'],
  ['qr','携入',''], ['g5','5G合约终端',''], ['zp','天翼智屏',''],
  ['mk','满卡(存量+新增)',''], ['ds','电信电视',''],
  ['lg','宽带离网','warn'], ['cj','宽带拆机','warn'],
];
function ringSvg(rate){
  const C = 2*Math.PI*40, r = rate==null ? 0 : Math.min(rate,1);
  return `<svg viewBox="0 0 92 92"><circle class="track" cx="46" cy="46" r="40"/>
    <circle class="prog" cx="46" cy="46" r="40" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-r)}"/></svg>`;
}
function renderDetail(){
  const b = CUR, m = TAB ? b.month : b.day;
  document.getElementById('rings').innerHTML = RINGDEF.map(([k,rk,label,unit]) =>
    `<div class="ring">${ringSvg(m[rk])}<div class="val">${fmt(m[k])}<small style="font-size:11px;color:#93a4c3"> ${unit}</small></div>
     <div class="cap">${label}完成率 <b>${pct(m[rk])}</b></div></div>`).join('');
  document.getElementById('chips').innerHTML = CHIPDEF.map(([k,label,cls]) => {
    if(m[k]==null) return '';
    return `<div class="chip ${cls}"><div class="k">${label}</div><div class="v">${fmt(m[k])}</div></div>`;
  }).join('');
  const rows = TAB ? b.pm : b.pd;
  document.getElementById('pTitle').textContent = (TAB ? M.m : M.d) + ' 支局到人明细';
  document.getElementById('pNote').textContent =
    `共 ${rows.length} 人有业绩 · ${TAB ? M.m+'1日—'+M.d+'累计（'+M.mDays+'天）' : '当日实时快照'} · 点击列名排序`;
  renderTable(rows);
}
const PCOLS = [
  ['n','姓名','t'], ['p','片区','t'], ['yd','移动','n'], ['zk','主卡','n'], ['fk','副卡','n'],
  ['kd','宽带','n'], ['rh','融合','n'], ['r129','129+','n'], ['r169','169+','n'],
  ['gt','高套','n'], ['fttr','FTTR','n'], ['g5','5G合约','n'], ['qr','携入','n'],
];
function renderTable(rows){
  const tb = document.getElementById('ptable');
  if(!rows.length){ tb.innerHTML = '<tbody><tr><td class="empty">该支局' +
    (TAB?'当月':'当日') + '暂无到人业绩</td></tr></tbody>'; return; }
  const s = SORT;
  const arr = rows.slice().sort((a,b2)=>{
    const x=a[s.key], y=b2[s.key];
    if(s.dir<0){ if(x!==y) return (x||0)<(y||0)?1:-1; return String(a.n).localeCompare(b2.n,'zh'); }
    if(x!==y) return (x||0)>(y||0)?1:-1; return String(a.n).localeCompare(b2.n,'zh');
  });
  let h = '<thead><tr>' + PCOLS.map(([k,label,tp])=>{
    const a = s.key===k ? `<span class="arr">${s.dir<0?'▼':'▲'}</span>` : '';
    return `<th onclick="setSort('${k}')">${label}${a}</th>`;}).join('') + '</tr></thead><tbody>';
  for(const r of arr){
    h += '<tr><td>' + esc(r.n) + '</td><td class="pcol" title="'+esc(r.p)+'">' + esc(shortArea(r.p)) + '</td>';
    for(let ci=2; ci<PCOLS.length; ci++){
      const k = PCOLS[ci][0]; const v = fmt(r[k]);
      h += (k==='rh' && r.rh>0) ? `<td><b>${v}</b></td>` : `<td>${v}</td>`;
    }
    h += '</tr>';
  }
  tb.innerHTML = h + '</tbody>';
}
function setSort(k){
  if(SORT.key===k) SORT.dir *= -1; else { SORT.key = k; SORT.dir = -1; }
  renderDetail();
}
function setTab(t){ TAB = t;
  document.getElementById('tabD').classList.toggle('on', t===0);
  document.getElementById('tabM').classList.toggle('on', t===1);
  SORT = {key:'rh', dir:-1};
  renderDetail();
}
function openM(g, i){
  CUR = g==='b' ? DATA.bailu[i] : DATA.other[i];
  document.getElementById('mTitle').textContent = CUR.full.replace('鹿城','') + (g==='b'?'支局':'');
  document.getElementById('mNote').textContent =
    `当日到人 ${CUR.pdn} 人 · 当月到人 ${CUR.pmn} 人`;
  TAB = 0; document.getElementById('tabD').classList.add('on');
  document.getElementById('tabM').classList.remove('on');
  SORT = {key:'rh', dir:-1};
  renderDetail();
  document.getElementById('mask').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeM(){ document.getElementById('mask').classList.remove('on'); document.body.style.overflow=''; }
document.getElementById('mask').addEventListener('click', e=>{ if(e.target.id==='mask') closeM(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeM(); });

/* ---------- footer ---------- */
function renderFoot(){
document.getElementById('foot').innerHTML =
  `数据来源：<b>${esc(M.f1)}</b> · <b>${esc(M.f2)}</b><br>
   口径说明：当日 = ${M.d}实时快照；当月 = ${M.m}1日—${M.d}累计（共${M.mDays}天）；携入为人员快报聚合口径；
   “未归属片区”为未挂支局编码人员的业绩；完成率 = 当期完成量 ÷ 当期计划。生成时间 ${M.gen}`;
}
renderFoot();


</script>
<div id="lock" style="display:none;position:fixed;inset:0;z-index:999;background:radial-gradient(900px 420px at 50% -80px,#16223e 0%,#070b14 62%);align-items:center;justify-content:center">
<div style="background:linear-gradient(180deg,#131c31,#0c1220);border:1px solid rgba(230,0,18,.55);border-radius:16px;padding:34px 38px 30px;width:min(400px,92vw);box-shadow:0 24px 80px rgba(0,0,0,.6);text-align:center">
<div style="font-size:21px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#fff 20%,#ff3b4e 60%,#f5c451);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">白鹿分局 · 营销到人大屏</div>
<div style="color:#93a4c3;font-size:13px;margin:8px 0 22px">数据已加密，请输入访问密码</div>
<input id="pwd" type="password" placeholder="访问密码" autocomplete="off"
 style="width:100%;box-sizing:border-box;background:#182342;border:1px solid #22304d;color:#e8edf7;font-size:16px;padding:11px 14px;border-radius:10px;outline:none;text-align:center;letter-spacing:2px"
 onkeydown="if(event.key==='Enter')tryLogin()">
<div id="lerr" style="color:#ff3b4e;font-size:12px;height:18px;margin-top:8px"></div>
<button onclick="tryLogin()" style="width:100%;background:linear-gradient(90deg,#e60012,#ff5a45);color:#fff;border:none;border-radius:10px;padding:11px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:4px">进 入</button>
<label style="display:flex;gap:7px;align-items:center;justify-content:center;color:#93a4c3;font-size:12px;margin-top:14px;cursor:pointer"><input id="remember" type="checkbox" checked style="accent-color:#e60012">记住密码（本机下次免输入）</label>
</div></div>
<script>
function b64ToBuf(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
async function tryDecrypt(pass){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey(
  {name:'PBKDF2',salt:b64ToBuf(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},
  km,{name:'AES-CTR',length:128},false,['decrypt']);
 const pt=new Uint8Array(await crypto.subtle.decrypt(
  {name:'AES-CTR',counter:b64ToBuf(ENC.nonce),length:64},key,b64ToBuf(ENC.ct)));
 if(new TextDecoder().decode(pt.slice(0,7))!=='BLDASH1')throw new Error('bad');
 return JSON.parse(new TextDecoder().decode(pt.slice(7)));
}
async function tryLogin(silent){
 const pass=document.getElementById('pwd').value.trim();
 if(!pass)return;
  try{
   DATA=await tryDecrypt(pass);
   if(document.getElementById('remember').checked)localStorage.setItem('bl_pass',pass);
   document.getElementById('lock').remove();
   renderSum();renderFoot();renderCards();
  }catch(e){
   if(silent===true){localStorage.removeItem('bl_pass');showLock();return}
   const el=document.getElementById('lerr');if(el)el.textContent='密码错误，请重试';
  }
}
function showLock(){document.getElementById('lock').style.display='flex';document.getElementById('pwd').focus()}
function lock_init(){
  const saved=localStorage.getItem('bl_pass');
  if(saved){document.getElementById('pwd').value=saved;tryLogin(true)}
  else showLock();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',lock_init);else lock_init();
</script>
